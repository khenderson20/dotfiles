<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stack-title stack-desc" id="stack-root">
        <title id="stack-title">Development stack · where the dotfiles sit</title>
        <desc id="stack-desc">Layer stack from operating system up through package managers, dev toolchain, shells and terminal, the dotfiles repo, and your projects, with the dotfiles layer highlighted as the one this repo versions.</desc>
  <defs>
      <style>#stack-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #stack-root { font-family: var(--font-sans); color: var(--color-ink); }
      #stack-root .diagram-container { width: 100%; overflow-x: auto; }
      #stack-root .diagram-container { overflow-x: visible; }</style>
  </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Direction column (left margin) -->
        <text x="48" y="60" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CLOSER TO YOU</text>
        <line x1="88" y1="80" x2="88" y2="456" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <polygon points="84,80 92,80 88,72" fill="#4f5d75"/>
        <text x="48" y="476" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HARDWARE</text>

        <!-- L6 — Your projects -->
        <rect x="120" y="72" width="800" height="64" fill="#f5f5f5"/>
        <line x1="120" y1="136" x2="920" y2="136" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
        <text x="140" y="108" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L6</text>
        <text x="248" y="110" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Your projects</text>
        <text x="900" y="110" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">C:\development · ~/development</text>

        <!-- L5 — Dotfiles (FOCAL) -->
        <rect x="120" y="136" width="800" height="64" fill="#bf4520" fill-opacity="0.08"/>
        <text x="140" y="172" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L5</text>
        <text x="248" y="174" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Dotfiles · this repo</text>
        <text x="900" y="174" fill="#bf4520" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">profile.ps1 · bash · zsh · vim · git · ssh · gpg</text>

        <!-- L4 — Shells & terminal -->
        <rect x="120" y="200" width="800" height="64" fill="#ececec"/>
        <line x1="120" y1="264" x2="920" y2="264" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
        <text x="140" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L4</text>
        <text x="248" y="238" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Shells &amp; terminal</text>
        <text x="900" y="238" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">pwsh 7 · Git Bash · zsh · Windows Terminal</text>

        <!-- L3 — Dev toolchain -->
        <rect x="120" y="264" width="800" height="64" fill="#f5f5f5"/>
        <line x1="120" y1="328" x2="920" y2="328" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
        <text x="140" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L3</text>
        <text x="248" y="302" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Dev toolchain</text>
        <text x="900" y="302" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">git · GnuPG · OpenSSH · MSVC · CMake · LLVM</text>

        <!-- L2 — Package managers -->
        <rect x="120" y="328" width="800" height="64" fill="#ececec"/>
        <line x1="120" y1="392" x2="920" y2="392" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
        <text x="140" y="364" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
        <text x="248" y="366" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Package managers</text>
        <text x="900" y="366" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">winget · scoop · choco  |  brew · apt</text>

        <!-- L1 — Operating system -->
        <rect x="120" y="392" width="800" height="64" fill="#f5f5f5"/>
        <text x="140" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L1</text>
        <text x="248" y="430" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Operating system</text>
        <text x="900" y="430" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">Windows 11 · macOS · Linux / WSL 2</text>

        <!-- Outer silhouette + focal stroke (drawn last so the layer fills don't cover them) -->
        <rect x="120" y="72" width="800" height="384" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <rect x="120" y="136" width="800" height="64" fill="none" stroke="#bf4520" stroke-width="1"/>

        <!-- Caption -->
        <text x="120" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FOCAL LAYER</text>
        <text x="232" y="513" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">The repo versions only this layer: it configures the shells and tools beneath it, but installs none of them.</text>
      </svg>

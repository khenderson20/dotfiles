<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 696" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="commit-push-title commit-push-desc" id="commit-push-root">
        <title id="commit-push-title">A signed commit and push, step by step</title>
        <desc id="commit-push-desc">Sequence diagram showing git asking gpg and gpg-agent to sign a commit, prompting for the passphrase only when it isn't cached, then pushing over Windows OpenSSH, where gpg-agent signs GitHub's login challenge with the GPG authentication key before GitHub accepts the push.</desc>
        <defs>
      <style>#commit-push-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #commit-push-root { font-family: var(--font-sans); color: var(--color-ink); }
      #commit-push-root .diagram-container { width: 100%; overflow-x: auto; }
      #commit-push-root .diagram-container { overflow-x: visible; }</style>
          <marker id="commit-push-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="commit-push-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="commit-push-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ LIFELINES · centers 112, 296, 480, 664, 848 ============ -->
        <line x1="112" y1="120" x2="112" y2="624" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="296" y1="120" x2="296" y2="624" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="480" y1="120" x2="480" y2="624" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="664" y1="120" x2="664" y2="624" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="848" y1="120" x2="848" y2="624" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ============ OPT FRAME (passphrase prompt) ============ -->
        <rect x="392" y="216" width="232" height="88" rx="4" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1"/>
        <rect x="392" y="216" width="40" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1"/>
        <text x="412" y="228" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
        <text x="404" y="248" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[not cached]</text>

        <!-- ============ ACTIVATION BARS ============ -->
        <rect x="108" y="164" width="8" height="200" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="108" y="404" width="8" height="212" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="292" y="168" width="8" height="192" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="476" y="200" width="8" height="128" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="476" y="504" width="8" height="32" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="660" y="408" width="8" height="196" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="844" y="440" width="8" height="32" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="844" y="568" width="8" height="32" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- ============ MESSAGES ============ -->
        <!-- Commit signing -->
        <line x1="116" y1="168" x2="292" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#commit-push-arrow)"/>
        <line x1="300" y1="200" x2="476" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#commit-push-arrow)"/>
        <path d="M 484 272 L 520 272 L 520 288 L 484 288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#commit-push-arrow)"/>
        <line x1="476" y1="328" x2="300" y2="328" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#commit-push-arrow)"/>
        <line x1="292" y1="360" x2="116" y2="360" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#commit-push-arrow)"/>
        <!-- Push -->
        <line x1="116" y1="408" x2="660" y2="408" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#commit-push-arrow)"/>
        <line x1="668" y1="440" x2="844" y2="440" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#commit-push-arrow-link)"/>
        <line x1="844" y1="472" x2="668" y2="472" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#commit-push-arrow-link)"/>
        <line x1="660" y1="504" x2="484" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#commit-push-arrow)"/>
        <line x1="484" y1="536" x2="660" y2="536" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#commit-push-arrow)"/>
        <line x1="668" y1="568" x2="844" y2="568" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#commit-push-arrow-link)"/>
        <line x1="844" y1="600" x2="668" y2="600" stroke="#bf4520" stroke-width="1.4" marker-end="url(#commit-push-arrow-accent)"/>

        <!-- ============ MESSAGE LABELS ============ -->
        <rect x="170" y="148" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="204" y="157" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGN COMMIT</text>

        <rect x="346" y="180" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="388" y="189" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGN · KEY [S]</text>

        <rect x="528" y="274" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="564" y="283" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ASK PINENTRY</text>

        <rect x="360" y="308" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="388" y="317" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGNATURE</text>

        <rect x="164" y="340" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="204" y="349" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGNED COMMIT</text>

        <rect x="348" y="388" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="388" y="397" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUSH OVER SSH</text>

        <rect x="722" y="420" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="756" y="429" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONNECT :22</text>

        <rect x="728" y="452" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="756" y="461" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHALLENGE</text>

        <rect x="530" y="484" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="572" y="493" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGN · KEY [A]</text>

        <rect x="544" y="516" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="572" y="525" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGNATURE</text>

        <rect x="722" y="548" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="756" y="557" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUTH + PACK</text>

        <rect x="716" y="580" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="756" y="589" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUSH ACCEPTED</text>

        <!-- ============ ACTORS ============ -->
        <!-- git -->
        <rect x="40" y="64" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="64" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="48" y="70" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="62" y="79" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
        <text x="112" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">git</text>
        <text x="112" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">commit -S · push</text>

        <!-- gpg -->
        <rect x="224" y="64" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="224" y="64" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="232" y="70" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="246" y="79" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GPG</text>
        <text x="296" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">gpg</text>
        <text x="296" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gpg.program</text>

        <!-- gpg-agent (focal) -->
        <rect x="408" y="64" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="408" y="64" width="144" height="56" rx="6" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/>
        <rect x="416" y="70" width="28" height="12" rx="2" fill="none" stroke="#bf4520" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="430" y="79" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGT</text>
        <text x="480" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">gpg-agent</text>
        <text x="480" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">keys never leave it</text>

        <!-- ssh.exe -->
        <rect x="592" y="64" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="592" y="64" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="600" y="70" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="614" y="79" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SSH</text>
        <text x="664" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ssh.exe</text>
        <text x="664" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Windows OpenSSH</text>

        <!-- GitHub (external) -->
        <rect x="776" y="64" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="776" y="64" width="144" height="56" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <rect x="784" y="70" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/>
        <text x="798" y="79" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="848" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GitHub</text>
        <text x="848" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">github.com:22</text>

        <!-- ============ LEGEND ============ -->
        <line x1="40" y1="648" x2="920" y2="648" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="120" y="668" width="14" height="10" rx="2" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/>
        <text x="140" y="676" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Holds the keys</text>

        <rect x="252" y="664" width="4" height="18" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="264" y="676" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Busy</text>

        <line x1="320" y1="673" x2="348" y2="673" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#commit-push-arrow)"/>
        <text x="356" y="676" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Local call</text>

        <line x1="440" y1="673" x2="468" y2="673" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#commit-push-arrow)"/>
        <text x="476" y="676" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Reply</text>

        <line x1="536" y1="673" x2="564" y2="673" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#commit-push-arrow-link)"/>
        <text x="572" y="676" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Network (SSH)</text>

        <line x1="680" y1="673" x2="708" y2="673" stroke="#bf4520" stroke-width="1.4" marker-end="url(#commit-push-arrow-accent)"/>
        <text x="716" y="676" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Success</text>
      </svg>

# gpg-agent settings shared by every OS. gpg-agent has no include
# directive, so install.ps1 writes the real gpg-agent.conf from this
# file plus the SSH line for the current OS:
#   Windows:       enable-win32-openssh-support
#   macOS / Linux: enable-ssh-support

# Passphrase cache: 1 hour since last use, 24 hours max
default-cache-ttl 3600
max-cache-ttl 86400
